name: Cyklomax sklad feed

on:
  schedule:
    - cron: '50 */4 * * *'   # každé 4 hodiny, posunuté oproti ostatným dodávateľom
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install lxml

      - name: Generate feed
        env:
          CYKLOMAX_XML_URL: ${{ secrets.CYKLOMAX_XML_URL }}
        run: |
          mkdir -p docs
          python3 cyklomax_sklad_feed.py - docs/cyklomax_sklad_shoptet.xml

      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/cyklomax_sklad_shoptet.xml
          git diff --staged --quiet || git commit -m "cyklomax sklad update"
          git push
